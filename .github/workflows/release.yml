name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: linux
          - platform: macos-latest
            target: macos
          - platform: windows-latest
            target: windows
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-workspaces: packages/analysisloom/src-tauri

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        working-directory: packages/analysisloom
        run: npm run tauri build
        env:
          CI: true

      - name: Generate Rust SBOM
        working-directory: packages/analysisloom/src-tauri
        run: |
          cargo install cargo-cyclonedx --locked 2>/dev/null || cargo install cargo-cyclonedx
          cargo cyclonedx --all-features --format json -o "sbom-rust-${{ matrix.target }}.json"

      - name: Generate npm SBOM
        run: npm sbom --sbom-format=cyclonedx --omit=dev -o "sbom-npm-${{ matrix.target }}.json" || true

      - name: Collect artifacts (Linux)
        if: matrix.target == 'linux'
        run: |
          mkdir -p release-artifacts
          cp packages/analysisloom/src-tauri/target/release/bundle/deb/*.deb release-artifacts/ 2>/dev/null || true
          cp packages/analysisloom/src-tauri/target/release/bundle/appimage/*.AppImage release-artifacts/ 2>/dev/null || true
          cp packages/analysisloom/src-tauri/sbom-rust-linux.json release-artifacts/ 2>/dev/null || true
          cp sbom-npm-linux.json release-artifacts/ 2>/dev/null || true

      - name: Collect artifacts (macOS)
        if: matrix.target == 'macos'
        run: |
          mkdir -p release-artifacts
          cp packages/analysisloom/src-tauri/target/release/bundle/dmg/*.dmg release-artifacts/ 2>/dev/null || true
          cp packages/analysisloom/src-tauri/target/release/bundle/macos/*.app release-artifacts/ -r 2>/dev/null || true
          cp packages/analysisloom/src-tauri/sbom-rust-macos.json release-artifacts/ 2>/dev/null || true
          cp sbom-npm-macos.json release-artifacts/ 2>/dev/null || true

      - name: Collect artifacts (Windows)
        if: matrix.target == 'windows'
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp packages/analysisloom/src-tauri/target/release/bundle/msi/*.msi release-artifacts/ 2>/dev/null || true
          cp packages/analysisloom/src-tauri/target/release/bundle/nsis/*.exe release-artifacts/ 2>/dev/null || true
          cp packages/analysisloom/src-tauri/sbom-rust-windows.json release-artifacts/ 2>/dev/null || true
          cp sbom-npm-windows.json release-artifacts/ 2>/dev/null || true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-artifacts/*
        continue-on-error: true

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v7
        with:
          name: analysisloom-${{ matrix.target }}
          path: release-artifacts/
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name || inputs.version }}
          name: AnalysisLoom ${{ github.ref_name || inputs.version }}
          draft: false
          prerelease: ${{ contains(github.ref_name || inputs.version, '-') }}
          generate_release_notes: true
          files: dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
