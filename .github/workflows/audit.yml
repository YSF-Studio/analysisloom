name: 🔒 Security Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".gitleaks.toml"
  workflow_dispatch:

jobs:
  cargo-audit:
    name: 📋 Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-workspaces: packages/analysisloom/src-tauri
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked 2>/dev/null || true
      - name: Audit Cargo project
        continue-on-error: true
        working-directory: packages/analysisloom/src-tauri
        run: cargo audit 2>&1 || true
