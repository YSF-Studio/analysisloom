name: Security Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-scheduled
  cancel-in-progress: false

jobs:
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-workspaces: packages/analysisloom/src-tauri
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        working-directory: packages/analysisloom/src-tauri
        run: cargo audit

  gitleaks:
    name: Gitleaks (scheduled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
