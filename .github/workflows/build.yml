name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect:
    name: Detect App
    runs-on: ubuntu-latest
    outputs:
      app_dir: ${{ steps.detect.outputs.app_dir }}
      cargo_ws: ${{ steps.detect.outputs.cargo_ws }}
      npm_lock: ${{ steps.detect.outputs.npm_lock }}
    steps:
      - uses: actions/checkout@v6
      - id: detect
        run: |
          if [ -d "packages/analysisloom" ] && [ -f "packages/analysisloom/src-tauri/Cargo.toml" ]; then
            echo "app_dir=packages/analysisloom" >> $GITHUB_OUTPUT
            echo "cargo_ws=packages/analysisloom/src-tauri" >> $GITHUB_OUTPUT
            echo "npm_lock=package-lock.json" >> $GITHUB_OUTPUT
          elif [ -f "src-tauri/Cargo.toml" ]; then
            echo "app_dir=." >> $GITHUB_OUTPUT
            echo "cargo_ws=src-tauri" >> $GITHUB_OUTPUT
            echo "npm_lock=package-lock.json" >> $GITHUB_OUTPUT
          else
            echo "app_dir=packages/analysisloom" >> $GITHUB_OUTPUT
            echo "cargo_ws=packages/analysisloom/src-tauri" >> $GITHUB_OUTPUT
            echo "npm_lock=package-lock.json" >> $GITHUB_OUTPUT
          fi

  quality:
    name: Quality (fmt, clippy, audit)
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux dependencies
        working-directory: ${{ needs.detect.outputs.app_dir }}
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache-workspaces: ${{ needs.detect.outputs.cargo_ws }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ needs.detect.outputs.npm_lock }}
      - name: Rust fmt
        working-directory: ${{ needs.detect.outputs.app_dir }}
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Rust clippy
        working-directory: ${{ needs.detect.outputs.app_dir }}
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        working-directory: ${{ needs.detect.outputs.app_dir }}
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Install npm deps
        run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high
      - name: Build frontend
        working-directory: ${{ needs.detect.outputs.app_dir }}
        run: npm run build

  security:
    name: Security (gitleaks, cargo audit)
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Gitleaks scan
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz" | tar xz
          ./gitleaks detect --source . --verbose --redact
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Cargo audit
        working-directory: ${{ needs.detect.outputs.cargo_ws }}
        run: |
          cargo install cargo-audit --locked 2>/dev/null || true
          cargo audit

  build:
    name: Build (${{ matrix.platform }})
    needs: [detect, quality]
    runs-on: ${{ matrix.platform }}
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        working-directory: ${{ needs.detect.outputs.app_dir }}
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-workspaces: ${{ needs.detect.outputs.cargo_ws }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ needs.detect.outputs.npm_lock }}
      - name: Install npm deps
        run: npm ci
      - name: Build Rust
        working-directory: ${{ needs.detect.outputs.app_dir }}
        run: cargo build --manifest-path src-tauri/Cargo.toml
      - name: Build Frontend
        working-directory: ${{ needs.detect.outputs.app_dir }}
        run: npm run build
