<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply"/>
    </filter>
  </defs>

  <!-- Navy background with subtle texture -->
  <rect width="512" height="512" rx="72" fill="#001a33"/>
  <rect width="512" height="512" rx="72" fill="#001a33" filter="url(#grain)" opacity="0.12"/>

  <!-- Shield emblem: stylized A + data trend line -->
  <g transform="translate(256 268)" fill="#000000">
    <!-- Shield outline segments -->
    <path d="M-118,-148 L0,-178 L118,-148 L118,42 L0,148 L-118,42 Z" fill="none" stroke="#000000" stroke-width="18" stroke-linejoin="miter"/>

    <!-- Left leg of A -->
    <path d="M-52,88 L-8,-72" stroke="#000000" stroke-width="22" stroke-linecap="square"/>

    <!-- Right leg of A -->
    <path d="M52,88 L8,-72" stroke="#000000" stroke-width="22" stroke-linecap="square"/>

    <!-- A apex -->
    <path d="M-8,-72 L8,-72" stroke="#000000" stroke-width="22" stroke-linecap="square"/>

    <!-- Data trend line: rise → dip → rise -->
    <path d="M-92,58 L-38,-18" stroke="#000000" stroke-width="20" stroke-linecap="square"/>
    <path d="M-38,-18 L0,28" stroke="#000000" stroke-width="20" stroke-linecap="square"/>
    <path d="M0,28 L38,-38" stroke="#000000" stroke-width="20" stroke-linecap="square"/>
    <path d="M38,-38 L92,-98" stroke="#000000" stroke-width="20" stroke-linecap="square"/>
  </g>
</svg>
